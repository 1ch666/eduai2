name: Fast regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # Public repository and standard runner only. No paid runner or secrets.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: node scripts/ci-fast.mjs
      # Editor/PlayMode/device tests are NOT covered by these Node checks.
      # Docker remains the separate Court Docker handoff workflow.
