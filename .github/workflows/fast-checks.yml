name: Fast regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # Public repository and standard runner only. No paid runner or secrets.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: node scripts/ci-fast.mjs
      # Editor/PlayMode/device tests are NOT covered by these Node checks.
      # Docker remains the separate Court Docker handoff workflow.
  local-api:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Disposable workerd integration (no production or AI credentials)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/copy-assets.mjs
          node node_modules/wrangler/bin/wrangler.js dev --local --ip 127.0.0.1 --port 8797 --persist-to "$RUNNER_TEMP/eduai-api-state" --var COURT_AI_ENABLED:false --var OLLAMA_API_KEY: > "$RUNNER_TEMP/eduai-api.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true' EXIT
          node scripts/wait-local-api.mjs http://127.0.0.1:8797
          node scripts/check-api.mjs http://127.0.0.1:8797
          node scripts/check-court-v1-api.mjs http://127.0.0.1:8797
          node scripts/check-npc-recovery-api.mjs http://127.0.0.1:8797
      - name: Isolated admission coordinator RPC (local only)
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/wrangler/bin/wrangler.js dev --config scripts/fixtures/admission-wrangler.jsonc --local --ip 127.0.0.1 --port 8798 --persist-to "$RUNNER_TEMP/admission-state" > "$RUNNER_TEMP/admission.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8798/ | grep -q admission-local-only; then break; fi
            kill -0 "$worker_pid"
            sleep 0.25
          done
          node scripts/check-admission-runtime.mjs http://127.0.0.1:8798
