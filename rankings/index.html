<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="公民法律研究室練習排行榜與段位系統。"><title>排行榜｜公民法律研究室</title><link rel="stylesheet" href="../styles.css"><script type="module" src="rankings.js"></script>
<style>
#rankings-table { width:100%; border-collapse:collapse; font-size:.9rem; margin-top:1rem; }
#rankings-table th, #rankings-table td { padding:.5rem .75rem; border-bottom:1px solid #e0e0e0; text-align:left; }
#rankings-table th { background:#f5f5f5; font-weight:600; }
.tier-badge { display:inline-block; padding:.15rem .55rem; border-radius:12px; font-size:.78rem; font-weight:700; background:#e8f0fe; color:#1a3a6b; }
.tier-見習生 { background:#f0f0f0; color:#555; }
.tier-初學者 { background:#e8f5e9; color:#2e7d32; }
.tier-進階者 { background:#e3f2fd; color:#1565c0; }
.tier-熟練者 { background:#fff3e0; color:#e65100; }
.tier-專家   { background:#fce4ec; color:#880e4f; }
#my-stats { border:1px solid #ddd; border-radius:8px; padding:1rem; margin:1rem 0; background:#fafafa; }
#my-stats h3 { margin:.25rem 0 .75rem; }
.stat-row { display:flex; gap:2rem; flex-wrap:wrap; }
.stat-item { display:flex; flex-direction:column; }
.stat-value { font-size:1.6rem; font-weight:700; }
.stat-label { font-size:.78rem; color:#666; }
.tier-progress { margin-top:.75rem; }
.tier-bar-wrap { background:#e0e0e0; border-radius:4px; height:8px; margin:.3rem 0; overflow:hidden; }
.tier-bar { height:100%; background:#4a90d9; border-radius:4px; transition:width .4s ease; }
#optin-section { border:1px solid #ddd; border-radius:8px; padding:1rem; margin:1rem 0; background:#fff; }
#optin-section p { margin:.25rem 0 .75rem; font-size:.9rem; color:#555; }
.tab-bar { display:flex; gap:.5rem; margin-bottom:1rem; }
.tab-btn { padding:.4rem .9rem; border:1px solid #ddd; border-radius:4px; background:#f5f5f5; cursor:pointer; font-size:.88rem; }
.tab-btn.active { background:#344b50; color:#fff; border-color:#344b50; }
#tier-notice { font-size:.82rem; color:#666; margin:.25rem 0; }
</style>
</head>
<body class="learning-page"><a class="skip-link" href="#learning-main">跳至內容</a><header class="learning-header"><a class="learning-brand" href="../">公民法律研究室<span>學習工具</span></a><button id="account-toggle">登入</button></header>
<main id="learning-main">
<nav class="learning-nav" aria-label="學習工具"><a href="../practice/">弱點練習</a><a href="../planner/">週排程</a><a href="../rankings/" aria-current="page">排行榜</a><a href="../photo/">照片講解</a></nav>
<div class="learning-heading"><p class="eyebrow">06 / RANK</p><h1>每一次練習，都算數。</h1><p>累積首次答對的積分，看見自己的進步。</p></div>
<p id="status" role="status"></p>

<!-- 自己的段位（登入才顯示）-->
<section id="my-stats" hidden>
  <h3>我的排行</h3>
  <div class="stat-row">
    <div class="stat-item"><span class="stat-value" id="my-tier-badge">—</span><span class="stat-label">段位</span></div>
    <div class="stat-item"><span class="stat-value" id="my-score">—</span><span class="stat-label">分數</span></div>
    <div class="stat-item"><span class="stat-value" id="my-rank">—</span><span class="stat-label">名次</span></div>
    <div class="stat-item"><span class="stat-value" id="my-correct">—</span><span class="stat-label">答對（首次）</span></div>
    <div class="stat-item"><span class="stat-value" id="my-attempts">—</span><span class="stat-label">作答次數</span></div>
  </div>
  <div class="tier-progress">
    <small id="tier-next-hint"></small>
    <div class="tier-bar-wrap"><div class="tier-bar" id="tier-bar" style="width:0%"></div></div>
  </div>
</section>

<!-- 加入／退出排行榜（登入才顯示）-->
<section id="optin-section" hidden>
  <h3>排行榜參與</h3>
  <p id="optin-desc">排行榜為自願加入。加入後，你的首次作答成績會計入公開榜；可隨時退出，退出後不再更新排名。</p>
  <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
    <button id="join-btn">加入排行榜</button>
    <button id="leave-btn" hidden>退出排行榜</button>
    <span id="optin-status" style="font-size:.85rem;color:#555"></span>
  </div>
</section>

<section id="rankings-section">
  <div class="section-top">
    <h2>練習積分榜</h2>
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-all">累積總分</button>
      <button class="tab-btn" id="tab-week">本週積分</button>
    </div>
  </div>
  <p id="tier-notice"></p>
  <p class="section-note">首次答對依難度獲得 1–3 分，重做不重複計分。</p>
  <div class="table-scroll" tabindex="0" role="region" aria-label="積分榜，可左右捲動">
  <table id="rankings-table" aria-label="排行榜">
    <thead><tr><th>名次</th><th>使用者</th><th>段位</th><th>分數</th><th>答對</th><th>作答</th></tr></thead>
    <tbody id="rankings-body"><tr><td colspan="6">載入中…</td></tr></tbody>
  </table>
  </div>
</section>

<section style="margin-top:1.5rem">
  <h3>段位說明</h3>
  <table style="border-collapse:collapse;font-size:.88rem">
    <thead><tr><th style="padding:.3rem .7rem;border-bottom:1px solid #ddd">段位</th><th style="padding:.3rem .7rem;border-bottom:1px solid #ddd">所需分數</th></tr></thead>
    <tbody id="tier-table"></tbody>
  </table>
  <p style="font-size:.82rem;color:#666;margin-top:.5rem">段位需排行榜達 20 人以上才開始顯示。</p>
</section>

<footer>排行榜為自願加入，分數僅供學習參考，非正式成績。AI 不決定排名。</footer>
</main></body></html>
